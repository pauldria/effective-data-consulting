{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>

  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

  {{ partial "service-list.html" (dict "audience" .Params.audience) }}

  <div class="cta">
    <p>Not sure which of these you need? That is usually the first conversation.</p>
    <p><a class="button" href="{{ "/contact/" | relURL }}">Start a conversation</a></p>
  </div>
</div>
{{ end }}
